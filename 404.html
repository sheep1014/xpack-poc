          (() => {
            const boot = document.getElementById('xpack-boot');
            const retry = document.getElementById('xpack-boot-retry');
            let english = true;
            try { english = localStorage.getItem('xpack.v905.locale') !== 'zh-Hant'; } catch {}
            const messages = {"loading.wait":["載入中","Loading"],"loading.failed":["載入失敗","Unable to Load"],"loading.images":["圖片載入","Image Loading"],"loading.imagesFailed":["部分圖片未能載入","Some Images Could Not Load"],"loading.retry":["重試","Retry"],"loading.ready":["已就緒","Ready"],"loading.replay":["重新播放","Replay"],"loading.simulateReady":["模擬就緒","Ready"],"loading.simulateFailure":["模擬失敗","Fail"]};
            const text = key => messages[key][english ? 1 : 0];
            boot.querySelector('[role="status"]').textContent = text('loading.wait');
            retry.textContent = text('loading.retry');
            retry.addEventListener('click', () => location.reload());
            const fail = () => {
              if (boot.hidden) return;
              boot.querySelector('.xp-brand-loading').dataset.state = 'error';
              boot.querySelector('.xp-brand-loading').setAttribute('aria-busy', 'false');
              boot.querySelector('[role="status"]').textContent = text('loading.failed');
              retry.hidden = false;
              document.getElementById('root').inert = true;
            };
            const timer = setTimeout(fail, 30000);
            let mounted = false;
            const styles = [...document.querySelectorAll('link[data-xpack-product-style]')];
            const stylesReady = () => {
              if (!styles.every(link => link.sheet)) return;
              styles.forEach(link => link.media = 'all');
              document.documentElement.dataset.xpackStyleReady = 'true';
              if (mounted) clearTimeout(timer);
              window.dispatchEvent(new Event('xpack:style-ready'));
            };
            styles.forEach(link => { link.addEventListener('load', stylesReady); link.addEventListener('error', fail); });
            stylesReady();
            window.addEventListener('xpack:boot-mounted', () => {
              mounted = true;
              if (document.documentElement.dataset.xpackStyleReady === 'true') clearTimeout(timer);
            }, {once:true});
            window.addEventListener('error', event => {
              if (event.target && event.target.tagName === 'SCRIPT') fail();
            }, true);
          })();
        </script>
